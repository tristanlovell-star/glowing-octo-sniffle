# Compiles the Spotter iPhone gym app whenever it changes.
# No signing or secrets needed — this just proves the code builds.
name: Spotter Build

on:
  push:
    paths:
      - "Spotter/**"
      - ".github/workflows/spotter-build.yml"
  workflow_dispatch:

concurrency:
  group: spotter-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Spotter
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: ../.github/scripts/select-xcode.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          runtimes = json.load(sys.stdin)['devices']
          phones = [(tuple(int(n) for n in re.findall(r'\d+', key.split('.')[-1])), d['udid'], d['name'])
                    for key, devices in runtimes.items() if 'iOS' in key
                    for d in devices if d['name'].startswith('iPhone') and 'SE' not in d['name']]
          version, udid, name = sorted(phones)[-1]
          print(udid)
          print(name, version, file=sys.stderr)
          ")
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Build and run tests on the simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project Spotter.xcodeproj \
            -scheme Spotter \
            -configuration Debug \
            -destination "id=$DEVICE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*(deprecated|unavailable)|SPOTTER\||Test Case .*(failed)|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST SUCCEEDED" build.log

      # Launches the app with sample data on each main screen and saves a picture of it,
      # so layout problems can be spotted without a phone.
      - name: Screenshots
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Spotter.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          mkdir -p screenshots
          for screen in onboarding today program progress coach equipment workout busy detail travel; do
            xcrun simctl launch "$DEVICE" "$BUNDLE" -demo -demoScreen "$screen"
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "screenshots/$screen.png"
            xcrun simctl terminate "$DEVICE" "$BUNDLE" || true
          done
          ls -la screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: spotter-screenshots
          path: Spotter/screenshots

      # Put "[screenshots]" in a commit message to refresh the pictures in Spotter/Docs.
      - name: Save screenshots to the branch
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[screenshots]')
        working-directory: .
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p Spotter/Docs
          for f in Spotter/screenshots/*.png; do
            sips -s format jpeg -s formatOptions 75 -Z 1300 "$f" --out "Spotter/Docs/$(basename "${f%.png}").jpg" >/dev/null
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Spotter/Docs
          git commit -m "Spotter: refresh screenshots" || exit 0
          git push origin "HEAD:$BRANCH"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotter-build-log
          path: Spotter/build.log
