# Apex GP — an Apple TV racing game.
# Generate the Xcode project with XcodeGen (run from this ApexGP folder):
#   brew install xcodegen
#   xcodegen generate
#   open ApexGP.xcodeproj
#
# Before running on a real Apple TV, change BASE_BUNDLE_ID below to something
# unique to you (e.g. com.yourname.apexgp) and pick your Team in Xcode.

name: ApexGP

options:
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    BASE_BUNDLE_ID: com.example.apexgp
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  ApexGP:
    type: application
    platform: tvOS
    sources:
      - App
      - Game
      - Garage
      - UI
      - path: Resources/tracks.json
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Apex GP
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.racing-games
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""

schemes:
  ApexGP:
    build:
      targets:
        ApexGP: all
    run:
      config: Debug
    archive:
      config: Release
