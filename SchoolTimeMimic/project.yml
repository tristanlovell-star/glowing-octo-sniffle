# SchoolTime Mimic — a Schooltime-style lock face for Apple Watch, plus a
# parent-controlled iPhone companion that blocks apps during school hours.
#
# Generate the Xcode project with XcodeGen (run from this SchoolTimeMimic folder):
#   brew install xcodegen
#   xcodegen generate
#   open SchoolTimeMimic.xcodeproj
#
# Before building on a real device:
#   1. Change BASE_BUNDLE_ID below to something unique to you (e.g. com.yourname.schooltime).
#      The App Group is derived from it automatically: group.<BASE_BUNDLE_ID>
#   2. Set DEVELOPMENT_TEAM (or pick your Team in Xcode for every target).
# See README.md for the capabilities / entitlements this project uses.

name: SchoolTimeMimic

options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    BASE_BUNDLE_ID: com.example.schooltimemimic
    APP_GROUP_ID: group.$(BASE_BUNDLE_ID)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  # ───────────────────────── iPhone app ─────────────────────────
  SchoolTimeMimic:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: ["**/Info.plist", "**/*.entitlements"]
      - Shared
      - SharedScreenTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/SchoolTimeMimic.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: SchoolTimeMonitor
      - target: SchoolTimeShield
      - target: SchoolTimeMimicWatch
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - sdk: WatchConnectivity.framework
      - sdk: LocalAuthentication.framework

  # Runs in the background at the start / end of each school-day interval
  # and turns the app shields on / off — even if the main app is not running.
  SchoolTimeMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityMonitor
        excludes: ["Info.plist", "*.entitlements"]
      - Shared/Models
      - SharedScreenTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).monitor
        INFOPLIST_FILE: DeviceActivityMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeviceActivityMonitor/SchoolTimeMonitor.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework

  # Draws the black + amber "Schooltime" screen shown when a blocked app is opened.
  SchoolTimeShield:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfiguration
        excludes: ["Info.plist", "*.entitlements"]
      - Shared/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).shield
        INFOPLIST_FILE: ShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldConfiguration/SchoolTimeShield.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework

  # ───────────────────────── Apple Watch app ─────────────────────────
  SchoolTimeMimicWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes: ["**/Info.plist"]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).watchkitapp
        INFOPLIST_FILE: Watch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: WatchConnectivity.framework

schemes:
  SchoolTimeMimic:
    build:
      targets:
        SchoolTimeMimic: all
    run:
      config: Debug
    archive:
      config: Release
  SchoolTimeMimicWatch:
    build:
      targets:
        SchoolTimeMimicWatch: all
    run:
      config: Debug
