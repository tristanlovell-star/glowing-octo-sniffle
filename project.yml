# Generate the Xcode project with XcodeGen:
#   brew install xcodegen
#   xcodegen generate
#   open BusTimes.xcodeproj
#
# Before building on a real device, change BASE_BUNDLE_ID below to something
# unique to you (e.g. com.yourname.bustimes) and pick your Team in Xcode.

name: BusTimes

options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    BASE_BUNDLE_ID: com.example.bustimes
    MARKETING_VERSION: "1.0"
    # Bump this for every upload to App Store Connect (each build number must be unique).
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  BusTimes:
    type: application
    platform: iOS
    sources:
      - iOS/App
      - path: Shared/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared/Core
      - Shared/AppUI
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: Bus Times
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.travel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BusTimesWidgetExtension
      - target: BusTimesWatch

  BusTimesWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - iOS/Widget
      - path: Shared/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared/Core
      - Shared/Widget
    info:
      path: iOS/Widget/Info.plist
      properties:
        CFBundleDisplayName: Bus Times
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"

  BusTimesWatch:
    type: application
    platform: watchOS
    sources:
      - Watch/App
      - path: Shared/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared/Core
      - Shared/AppUI
    info:
      path: Watch/App/Info.plist
      properties:
        CFBundleDisplayName: Bus Times
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BASE_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BusTimesWatchWidgetExtension

  BusTimesWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      - Watch/Widget
      - path: Shared/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared/Core
      - Shared/Widget
    info:
      path: Watch/Widget/Info.plist
      properties:
        CFBundleDisplayName: Bus Times
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).watchkitapp.widgets

schemes:
  BusTimes:
    build:
      targets:
        BusTimes: all
    run:
      config: Debug
    archive:
      config: Release
  BusTimesWatch:
    build:
      targets:
        BusTimesWatch: all
    run:
      config: Debug
