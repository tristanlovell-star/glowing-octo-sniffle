# Compiles the iPhone app, widget, Watch app and complications on every push.
# No signing or secrets needed — this just proves the code builds.
name: Build

on:
  push:
    # Apex GP has its own workflow (apexgp-build.yml).
    paths-ignore:
      - "ApexGP/**"
      - ".github/workflows/apexgp-*.yml"
      - "SchoolTimeMimic/**"
      - ".github/workflows/schooltime-*.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feed-check:
    # Quick Linux sanity check that the Translink feed and decoder still agree.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Next buses at Adelaide St Stop 30
        run: TZ=Australia/Brisbane python3 Tools/next_buses.py 000030 --walk 5

  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iOS Simulator (includes Watch app and widgets)
        run: |
          set -o pipefail
          xcodebuild build \
            -project BusTimes.xcodeproj \
            -scheme BusTimes \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*(deprecated|unavailable)|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
